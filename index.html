<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overtime Desk | The front desk that works your overtime</title>
<meta name="description" content="Overtime Desk: AI call answering, missed-call text-back and follow-up for HVAC and home-service businesses around Louisville, KY. Coming soon.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://overtimedesk.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Overtime Desk">
<meta property="og:description" content="The front desk that works your overtime. Coming soon.">
<meta property="og:url" content="https://overtimedesk.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14213D">
<style>
:root{--amber:#F59E0B;--navy:#14213D;--navy2:#1C2D52;--orange:#F97316;--orange-d:#C2410C;--paper:#FAF7F2;--muted:#AEB7C7;
--head:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:#fff;font:17px/1.6 var(--body);display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.wrap{max-width:720px;text-align:center}
.logo{font:800 30px/1 var(--head);letter-spacing:.06em;display:inline-flex;align-items:center;gap:12px}
.logo .ot{color:var(--amber)}
.clock{width:30px;height:30px;border:4px solid var(--amber);border-radius:50%;position:relative;display:inline-block}
.clock:before{content:"";position:absolute;left:10px;top:3px;width:4px;height:10px;background:#fff;border-radius:2px}
.clock:after{content:"";position:absolute;left:10px;top:10px;width:9px;height:4px;background:#fff;border-radius:2px;transform:rotate(35deg);transform-origin:left center}
.eyebrow{margin:40px 0 0;font:700 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
h1{font:800 56px/1.06 var(--head);letter-spacing:-.5px;margin:14px 0 18px}
p.sub{font-size:20px;color:#D9DEE8;margin:0 auto 32px;max-width:600px}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;padding:14px 24px;border-radius:6px}
.btn:hover,.btn:focus{background:var(--orange-d)}
.btn:focus{outline:3px solid var(--amber);outline-offset:3px}
footer{background:#0E1730;color:var(--muted);text-align:center;font-size:14px;padding:18px 24px}
footer a{color:#fff}
@media (max-width:560px){h1{font-size:40px}p.sub{font-size:18px}.logo{font-size:24px}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="logo" role="img" aria-label="Overtime Desk"><span class="clock" aria-hidden="true"></span><span class="ot">OVERTIME</span>&nbsp;DESK</div>
    <p class="eyebrow">Coming soon</p>
    <h1>The front desk that works your overtime.</h1>
    <p class="sub">AI call answering, missed-call text-back and follow-up for HVAC and home-service businesses around Louisville, KY.</p>
    <a class="btn" href="mailto:hello@overtimedesk.com">hello@overtimedesk.com</a>
  </div>
</main>
<footer>&copy; 2026 Overtime Desk &middot; <a href="mailto:hello@overtimedesk.com">hello@overtimedesk.com</a></footer>
</body>
</html>
